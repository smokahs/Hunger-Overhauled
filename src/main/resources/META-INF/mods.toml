[[mixins]]
    config="${mod_id}.mixins.json"

[[mixins]]
    config="${mod_id}.appleskin.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/smokahs/Hunger-Overhauled"
authors="${mod_authors}"
credits="iguanaman for the original mod; progwml6, Parker8283 and squeek502 for maintaining it through 1.12"
